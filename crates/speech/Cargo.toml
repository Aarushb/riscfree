[package]
name = "speech"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["prism"]
# Prism screen reader bridge (builds the Prism C++ core; needs cmake + MSVC).
prism = ["dep:prismer"]

[dependencies]
# Prism routes speech to NVDA/JAWS/SAPI-style backends. Pre-1.0, so it sits
# behind a feature and the Speaker trait keeps fallbacks swappable.
prismer = { version = "0.1", optional = true }
